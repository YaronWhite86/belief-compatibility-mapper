[project]
name = "belief-compatibility-mapper"
version = "0.1.0"
description = "Map and score compatibility between beliefs"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39",
    "networkx>=3",
    "numpy>=1.24",
    "openai>=1",
    "plotly>=5",
    "pydantic>=2",
    "rich>=13",
    "typer>=0.9",
]

[project.optional-dependencies]
tfidf = ["scikit-learn>=1.3"]
test = ["pytest>=8", "scikit-learn>=1.3"]

[project.scripts]
bcm = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: marks tests that call real APIs (deselect with '-m not live')"]
